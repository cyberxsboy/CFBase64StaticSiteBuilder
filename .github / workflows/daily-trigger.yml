name: Daily Trigger Cloudflare Pages Build

on:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:


on:
  schedule:
    # 每天 UTC 时间 00:00 执行 (北京时间早上 8:00)
    - cron: '0 0 * * *'
  # 允许手动在 Actions 页面触发
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages Deploy Hook
        # 确保你在 GitHub 仓库的 Secrets 中配置了 CF_PAGES_DEPLOY_HOOK
        run: curl -X POST "${{ secrets.CF_PAGES_DEPLOY_HOOK }}"
